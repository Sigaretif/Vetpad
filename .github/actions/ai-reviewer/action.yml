# Composite action that runs the code reviewer from packages/code-reviewer on a pull request
# diff (M5L3, based on .claude/config-templates/m5l3-action.yml.template).
# There is no bundle: the Claude Agent SDK starts a native binary it resolves from
# optionalDependencies, so the action installs the package with `npm ci` (never
# `--omit=optional`) and runs the TypeScript source with Node's type stripping.
# src/ci.ts reads ANTHROPIC_API_KEY, DIFF_FILE, PR_TITLE and PR_BODY from env and prints the
# review JSON (packages/code-reviewer/src/review-schema.ts) alone on stdout. The model stays
# in packages/code-reviewer/src/config.ts, so the action has no `model` input.
name: AI Reviewer
description: Run the Vetpad code reviewer on a pull request diff

inputs:
  api-key:
    description: Anthropic API key for the reviewer (in the workflow from the CODE_REVIEWER_API_KEY secret)
    required: true
  pr-title:
    description: Pull request title
    required: true
  pr-body:
    description: Pull request description (optional; costs tokens)
    required: false
    default: ""
  diff-file:
    description: Path to a file with the PR diff (a file avoids step-output size and newline limits)
    required: true

outputs:
  verdict:
    description: Binding pass/fail verdict from the agent
    value: ${{ steps.agent.outputs.verdict }}
  review-file:
    description: Path to the full JSON review
    value: ${{ steps.agent.outputs.review-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: packages/code-reviewer/package-lock.json

    - name: Install reviewer
      shell: bash
      working-directory: ${{ github.workspace }}/packages/code-reviewer
      # No --omit=optional: the SDK's native binary lives in optionalDependencies.
      run: npm ci

    - name: Run agent
      id: agent
      shell: bash
      working-directory: ${{ github.workspace }}/packages/code-reviewer
      # Untrusted PR text goes through env, never interpolated into the script.
      env:
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        DIFF_FILE: ${{ inputs.diff-file }}
      run: |
        review_file="$RUNNER_TEMP/ai-review.json"
        node src/ci.ts > "$review_file"
        verdict=$(node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (!["pass", "fail"].includes(r.verdict)) process.exit(1); console.log(r.verdict)' "$review_file")
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "review-file=$review_file" >> "$GITHUB_OUTPUT"
